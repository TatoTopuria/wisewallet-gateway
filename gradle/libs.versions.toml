[versions]
spring-boot                = "3.4.4"
spring-cloud               = "2024.0.1"
spring-cloud-aws           = "3.3.0"
lombok                     = "1.18.36"
jjwt                       = "0.12.6"
testcontainers             = "1.20.4"
resilience4j               = "2.2.0"
logstash-logback-encoder   = "8.0"
otel-agent                 = "2.12.0"

[plugins]
springBoot    = { id = "org.springframework.boot",          version.ref = "spring-boot" }
springDepMgmt = { id = "io.spring.dependency-management",   version = "1.1.7" }

[libraries]
# BOMs
spring-boot-bom        = { module = "org.springframework.boot:spring-boot-dependencies",       version.ref = "spring-boot" }
spring-cloud-bom       = { module = "org.springframework.cloud:spring-cloud-dependencies",      version.ref = "spring-cloud" }
testcontainers-bom     = { module = "org.testcontainers:testcontainers-bom",                   version.ref = "testcontainers" }

# Annotation processors
lombok-lib             = { module = "org.projectlombok:lombok",                                version.ref = "lombok" }

# Spring
spring-cloud-gateway               = { module = "org.springframework.cloud:spring-cloud-starter-gateway" }
spring-boot-starter-security       = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-data-redis-reactive = { module = "org.springframework.boot:spring-boot-starter-data-redis-reactive" }
spring-cloud-circuitbreaker-reactor = { module = "org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j" }
spring-boot-starter-actuator       = { module = "org.springframework.boot:spring-boot-starter-actuator" }

# JWT
jjwt-api                           = { module = "io.jsonwebtoken:jjwt-api",                    version.ref = "jjwt" }
jjwt-impl                          = { module = "io.jsonwebtoken:jjwt-impl",                   version.ref = "jjwt" }
jjwt-jackson                       = { module = "io.jsonwebtoken:jjwt-jackson",                version.ref = "jjwt" }

# Observability
micrometer-prometheus              = { module = "io.micrometer:micrometer-registry-prometheus" }
logstash-logback-encoder           = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-logback-encoder" }

# Test
spring-boot-starter-test           = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-security-test               = { module = "org.springframework.security:spring-security-test" }
testcontainers-junit               = { module = "org.testcontainers:junit-jupiter" }
