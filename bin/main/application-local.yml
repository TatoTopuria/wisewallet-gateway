gateway:
  cors:
    allowed-origins:
      - http://localhost:3000

spring:
  data:
    redis:
      host: localhost
      port: 6379

gateway:
  routes:
    account-service:
      uri: http://localhost:8081
    transaction-service:
      uri: http://localhost:8082
    notification-service:
      uri: http://localhost:8083
    advisor-service:
      uri: http://localhost:8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers,gateway

logging:
  level:
    com.wisewallet: DEBUG
