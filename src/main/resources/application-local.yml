gateway:
  cors:
    allowed-origins:
      - http://localhost:3000
  routes:
    account-service:
      uri: http://localhost:8081
    transaction-service:
      uri: http://localhost:8082
    notification-service:
      uri: http://localhost:8083
    advisor-service:
      uri: http://localhost:8084

spring:
  data:
    redis:
      host: localhost
      port: 6379

# Local dev: hardcoded internal JWT secret (min 32 chars)
# Override via INTERNAL_JWT_SECRET env var for all other environments
wisewallet:
  internal:
    jwt:
      secret: local-dev-internal-jwt-secret-needs-32chars!

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers,gateway

logging:
  level:
    com.wisewallet: DEBUG
